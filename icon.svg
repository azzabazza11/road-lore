<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Passenger Tales">
  <!-- dark card background -->
  <rect width="512" height="512" rx="112" fill="#12161c"/>
  <!-- glowing road ribbon - perspective stripe narrowing toward top -->
  <path d="M128 440 Q160 300 220 220 Q256 172 256 140" fill="none" stroke="#c9953d" stroke-width="36" stroke-linecap="round"/>
  <path d="M384 440 Q352 300 292 220 Q256 172 256 140" fill="none" stroke="#c9953d" stroke-width="36" stroke-linecap="round"/>
  <!-- road centre dashes -->
  <line x1="256" y1="400" x2="256" y2="358" stroke="#f0d898" stroke-width="14" stroke-linecap="round"/>
  <line x1="256" y1="330" x2="256" y2="294" stroke="#f0d898" stroke-width="14" stroke-linecap="round"/>
  <line x1="256" y1="270" x2="256" y2="240" stroke="#f0d898" stroke-width="10" stroke-linecap="round" opacity=".7"/>
  <!-- voice / story waves emanating from horizon point -->
  <path d="M256 140 Q286 118 308 95" fill="none" stroke="#7fd6d1" stroke-width="12" stroke-linecap="round" opacity=".95"/>
  <path d="M256 140 Q276 110 290 82" fill="none" stroke="#7fd6d1" stroke-width="8" stroke-linecap="round" opacity=".7"/>
  <path d="M256 140 Q226 118 204 95" fill="none" stroke="#7fd6d1" stroke-width="12" stroke-linecap="round" opacity=".95"/>
  <path d="M256 140 Q236 110 222 82" fill="none" stroke="#7fd6d1" stroke-width="8" stroke-linecap="round" opacity=".7"/>
  <!-- warm glow at horizon -->
  <circle cx="256" cy="140" r="20" fill="#d4863c" opacity=".85"/>
  <circle cx="256" cy="140" r="10" fill="#f7d898"/>
  <!-- star hints -->
  <circle cx="130" cy="88" r="5" fill="#f0d898" opacity=".7"/>
  <circle cx="380" cy="72" r="4" fill="#f0d898" opacity=".55"/>
  <circle cx="340" cy="100" r="3" fill="#f0d898" opacity=".45"/>
  <circle cx="170" cy="105" r="3" fill="#f0d898" opacity=".45"/>
</svg>
