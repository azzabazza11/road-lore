# Automatically keeps the Passenger Tales card on https://azzabazza11.github.io/apps/
# up to date whenever main changes version.json.
#
# Prerequisites (one-time):
#   1. Add azzabazza11/azzabazza11.github.io to the Cursor GitHub App installation
#      (or grant this Action a PAT that can push to it).
#   2. Add a repo secret HUB_TOKEN — a PAT with repo scope on azzabazza11/azzabazza11.github.io.
#
# Until HUB_TOKEN is set the job exits cleanly (skip, no failure).

name: Sync Passenger Tales hub card

on:
  push:
    branches: [main]
    paths:
      - version.json
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check HUB_TOKEN
        env:
          HUB_TOKEN: ${{ secrets.HUB_TOKEN }}
        run: |
          if [ -z "$HUB_TOKEN" ]; then
            echo "HUB_TOKEN not set — skipping hub sync."
            echo "Add a PAT with repo scope on azzabazza11/azzabazza11.github.io as HUB_TOKEN."
            exit 0
          fi
          echo "HUB_TOKEN found, continuing."

      - uses: actions/checkout@v4

      - name: Read version
        id: ver
        run: echo "version=$(jq -r .version version.json)" >> "$GITHUB_OUTPUT"

      - name: Clone hub and patch card
        env:
          HUB_TOKEN: ${{ secrets.HUB_TOKEN }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          git clone --depth 1 \
            "https://x-access-token:${HUB_TOKEN}@github.com/azzabazza11/azzabazza11.github.io.git" \
            hub

          BRANCH="passenger-tales-v${VERSION}"
          cd hub
          git checkout -b "$BRANCH"

          python3 ../scripts/sync-hub-road-lore.py .

          if git diff --quiet; then
            echo "Hub already up to date — nothing to commit."
            exit 0
          fi

          git add apps/index.html apps/service-worker.js
          git commit -m "Passenger Tales → v${VERSION} on the hub card."
          git push origin "$BRANCH"

          # Open a PR using the hub token
          curl -sf -X POST \
            -H "Authorization: token ${HUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/azzabazza11/azzabazza11.github.io/pulls \
            -d "{
              \"title\": \"Passenger Tales v${VERSION}\",
              \"body\": \"Auto-synced from road-lore version.json.\",
              \"head\": \"${BRANCH}\",
              \"base\": \"main\"
            }" | jq -r '.html_url'
