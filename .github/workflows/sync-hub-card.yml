# Automatically keeps the Passenger Tales card on https://azzabazza11.github.io/apps/
# up to date whenever main changes version.json.
#
# Prerequisites (one-time):
#   Add a repo secret HUB_TOKEN — a classic PAT with repo scope, owned by azzabazza11.
#
# Until HUB_TOKEN is set the job exits cleanly (skip, no failure).

name: Sync Passenger Tales hub card

on:
  push:
    branches: [main]
    paths:
      - version.json
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check HUB_TOKEN
        env:
          HUB_TOKEN: ${{ secrets.HUB_TOKEN }}
        run: |
          if [ -z "$HUB_TOKEN" ]; then
            echo "HUB_TOKEN not set — skipping hub sync."
            exit 0
          fi
          echo "HUB_TOKEN found, continuing."

      - uses: actions/checkout@v4

      - name: Read version
        id: ver
        run: echo "version=$(jq -r .version version.json)" >> "$GITHUB_OUTPUT"

      - name: Clone hub and patch card
        env:
          HUB_TOKEN: ${{ secrets.HUB_TOKEN }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"

          # actions/checkout sets a global credential helper that intercepts ALL
          # github.com git operations and strips embedded tokens from URLs.
          # Override it so hub operations use the PAT directly via the URL.
          git config --global credential.helper ""
          git config --global "url.https://${HUB_TOKEN}@github.com/.insteadOf" "https://github.com/"

          git clone --depth 1 \
            "https://github.com/azzabazza11/azzabazza11.github.io.git" \
            hub

          cd hub
          BRANCH="passenger-tales-v${VERSION}"
          git push origin --delete "$BRANCH" 2>/dev/null || true
          git checkout -b "$BRANCH"

          python3 ../scripts/sync-hub-road-lore.py .

          if git diff --quiet && git diff --cached --quiet; then
            echo "Hub already up to date — nothing to commit."
            exit 0
          fi

          git add apps/index.html apps/service-worker.js
          git commit -m "Passenger Tales → v${VERSION} on the hub card."
          git push origin "$BRANCH"

          # Open a PR (fails silently if one already exists)
          curl -s -X POST \
            -H "Authorization: token ${HUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/azzabazza11/azzabazza11.github.io/pulls \
            -d "{
              \"title\": \"Passenger Tales v${VERSION}\",
              \"body\": \"Auto-synced from road-lore version.json.\",
              \"head\": \"${BRANCH}\",
              \"base\": \"main\"
            }" | jq -r 'if .html_url then .html_url else .errors[0].message end'
