# Keeps the Passenger Tales card on https://azzabazza11.github.io/apps/
# up to date whenever main changes version.json.
#
# Prerequisite: repo secret HUB_KEY_TOKEN — a classic PAT with repo scope.

name: Sync Passenger Tales hub card

on:
  push:
    branches: [main]
    paths:
      - version.json
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check HUB_KEY_TOKEN
        env:
          HUB_KEY_TOKEN: ${{ secrets.HUB_KEY_TOKEN }}
        run: |
          if [ -z "$HUB_KEY_TOKEN" ]; then
            echo "HUB_KEY_TOKEN not set — skipping hub sync."
            exit 0
          fi
          echo "HUB_KEY_TOKEN found."

      - uses: actions/checkout@v4

      - name: Read version
        id: ver
        run: echo "version=$(jq -r .version version.json)" >> "$GITHUB_OUTPUT"

      - name: Sync hub card
        env:
          HUB_KEY_TOKEN: ${{ secrets.HUB_KEY_TOKEN }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail

          # actions/checkout injects a LOCAL credential helper (extraheader) that
          # overrides any token for github.com operations. Unset it globally and
          # inject our PAT via url.insteadOf so all git operations use it.
          git config --global --unset-all "http.https://github.com/.extraheader" || true
          git config --global credential.helper ""
          git config --global "url.https://${HUB_KEY_TOKEN}@github.com/.insteadOf" "https://github.com/"

          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"

          git clone --depth 1 https://github.com/azzabazza11/azzabazza11.github.io.git hub
          cd hub

          BRANCH="passenger-tales-v${VERSION}"
          git push origin --delete "$BRANCH" 2>/dev/null || true
          git checkout -b "$BRANCH"

          python3 ../scripts/sync-hub-road-lore.py .

          if git diff --quiet && git diff --cached --quiet; then
            echo "Hub already up to date."
            exit 0
          fi

          git add apps/index.html apps/service-worker.js
          git commit -m "Passenger Tales v${VERSION}"
          git push origin "$BRANCH"

          curl -s -X POST \
            -H "Authorization: token ${HUB_KEY_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/azzabazza11/azzabazza11.github.io/pulls \
            -d "{
              \"title\": \"Passenger Tales v${VERSION}\",
              \"body\": \"Auto-synced from road-lore version.json.\",
              \"head\": \"${BRANCH}\",
              \"base\": \"main\"
            }" | jq -r 'if .html_url then .html_url else .errors[0].message // "PR may already exist" end'
