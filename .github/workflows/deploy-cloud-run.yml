# Deploy the live app to Cloud Run when main is updated.
# One-time: add repo secret GCP_SA_KEY (JSON key for a deploy service account).
# TTS cache: GCS_BUCKET is a Cloud Run env var, not set here. After first
# deploy of this code, run `gcloud run services update road-lore --region
# australia-southeast1 --update-env-vars=GCS_BUCKET=passenger-tales-clips`
# (and create the bucket + IAM as in README). The Action must not pass
# --set-env-vars or it will wipe existing env including GCS_BUCKET.

name: Deploy Cloud Run

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-cloud-run
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check deploy credentials
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          if [ -z "$GCP_SA_KEY" ]; then
            echo "::error::GCP_SA_KEY is not set. Add it under Settings → Secrets and variables → Actions, then re-run this workflow. Until then Cloud Run stays on the last manual deploy (currently older than GitHub Pages)."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: road-lore
          region: australia-southeast1
          source: .
          flags: --allow-unauthenticated --max-instances=5
